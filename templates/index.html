<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Оценка песни</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow">
          <div class="card-header bg-primary text-white">
            <h2 class="mb-0 text-center">Оценка песни</h2>
          </div>
          <div class="card-body">

            <!-- Сообщения об ошибках (flash-сообщения) -->
            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <div class="alert alert-danger" role="alert">
                  <ul class="mb-0">
                    {% for msg in messages %}
                      <li>{{ msg }}</li>
                    {% endfor %}
                  </ul>
                </div>
              {% endif %}
            {% endwith %}

            <!-- Форма -->
            <form method="POST" enctype="multipart/form-data">
              <div class="mb-3">
                <label for="song_title" class="form-label">Название песни</label>
                <input type="text" class="form-control" id="song_title" name="song_title" required>
              </div>

              <div class="mb-3">
                <label for="artist" class="form-label">Исполнитель</label>
                <input type="text" class="form-control" id="artist" name="artist" required>
              </div>

              <div class="mb-3">
                <label for="lyrics_url" class="form-label">Ссылка на текст</label>
                <input type="url" class="form-control" id="lyrics_url" name="lyrics_url" required>
              </div>

              <div class="mb-3">
                <label for="audio_file" class="form-label">Аудиофайл (MP3/WAV)</label>
                <input class="form-control" id="audio_file" name="audio_file" type="file" accept=".mp3,.wav" required>
              </div>

              <div class="mb-3 form-check">
                <input class="form-check-input" type="checkbox" id="use_db" name="use_db">
                <label class="form-check-label" for="use_db">
                  Использовать данные из базы (если уже оценивалась)
                </label>
              </div>

              <div class="d-grid">
                <button type="submit" class="btn btn-success">Оценить</button>
              </div>
            </form>

          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
